# Stack de production : Caddy en frontal HTTPS, Streamlit en interne.
#
# Démarrage :
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requis : .env contient PUBLIC_DOMAIN, ACME_EMAIL, STREAMLIT_BROWSER_SERVER_ADDRESS,
# BASIC_AUTH_USER et BASIC_AUTH_HASH (authentification Caddy obligatoire).
# Le login Garmin se fait dans l'interface : GARMIN_PASSWORD est inutile ici.
# Les ports 80 et 443 doivent être ouverts (challenge Let's Encrypt + HTTPS).
#
# Différences vs docker-compose.yml (dev) :
#  - Pas de bind mount du code source ; l'image contient le code via COPY.
#    Mettre à jour le code → `docker compose -f docker-compose.prod.yml build app`.
#  - Cache disque et tokens Garmin sur volumes nommés → survivent aux rebuilds.
#  - Service Caddy en frontal, port 8501 non exposé.

services:
  app:
    build: ./app
    image: garmin-dashboard:latest
    env_file: .env
    environment:
      # Le dashboard ne lit jamais le mot de passe : il n'a rien à faire dans
      # l'environnement d'un conteneur exposé (docker inspect, /proc/1/environ).
      GARMIN_PASSWORD: ""
      # « Aujourd'hui » dans le fuseau de l'athlète (le conteneur est en UTC).
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - app_cache:/app/.cache
      - garmin_tokens:/app/.garmin
      # Objectif, plan validé et journal des séances poussées : à conserver
      # entre deux rebuilds (sinon « retirer du calendrier » perd sa mémoire).
      - app_data:/app/.data
    expose:
      - "8501"
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    # Uniquement les variables du Caddyfile : un `env_file: .env` donnerait
    # aussi les identifiants Garmin au conteneur exposé sur Internet. Le `:?`
    # fait échouer `docker compose up` si l'authentification n'est pas définie.
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER requis (cf. Caddyfile)}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH requis (cf. Caddyfile)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  web:

volumes:
  app_cache:
  app_data:
  garmin_tokens:
  caddy_data:
  caddy_config:
