# Stack de développement local.
#
# Le port est publié sur 127.0.0.1 uniquement : le dashboard n'est joignable que
# depuis cette machine, jamais depuis le reste du réseau local. C'est important
# car l'app n'a aucune authentification propre — quiconque atteint le port voit
# les données Garmin. Ne pas remplacer par "8501:8501" (= 0.0.0.0, tout le LAN) ;
# pour une exposition volontaire, passer par docker-compose.prod.yml (Caddy+HTTPS).
#
# `--server.address=0.0.0.0` (Dockerfile) reste correct : c'est l'écoute DANS le
# conteneur, sans laquelle la redirection de port ne fonctionnerait pas.

services:
  app:
    build: ./app
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    environment:
      # Pousser des séances dans le calendrier Garmin (page Objectif) : activé
      # ici parce que le port n'écoute que sur 127.0.0.1. Désactivé par défaut
      # ailleurs (prod) : une instance exposée ne doit pas pouvoir écrire.
      GARMIN_WRITE_ENABLED: "true"
      # Le dashboard ne lit jamais le mot de passe (comme en prod) : il n'a rien
      # à faire dans l'environnement du conteneur (docker inspect, /proc/1/environ).
      GARMIN_PASSWORD: ""
      # « Aujourd'hui » (titre, séance du jour) dans le fuseau de l'athlète, pas en UTC.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./app:/app
    restart: unless-stopped
